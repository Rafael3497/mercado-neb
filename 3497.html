<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Mercado NEB</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1d4ed8;
        }

        label {
            display: block;
            margin-top: 14px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1d4ed8;
            outline: none;
        }

        textarea { height: 60px; resize: vertical; background-color: #f8fafc; color: #475569; }

        .preview {
            text-align: center;
            margin: 14px 0 4px;
            min-height: 130px;
            background: #f8fafc;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #cbd5e1;
        }

        .preview img {
            max-width: 120px;
            max-height: 120px;
            object-fit: contain;
            display: none;
        }

        .preview span {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        button {
            margin-top: 24px;
            width: 100%;
            padding: 13px;
            border: none;
            background: #1d4ed8;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background: #1b4f72; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        .msg {
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .msg.sucesso { background: #dcfce7; color: #166534; }
        .msg.erro    { background: #fef2f2; color: #991b1b; }
        .msg.info    { background: #e0f2fe; color: #075985; }

        .preco-dica {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 3px;
        }

        .loading-input {
            background: url('https://i.gifer.com/ZZ5H.gif') no-repeat right 10px center;
            background-size: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛒 Cadastro de Produto Automatizado</h2>

    <label>Link afiliado *</label>
    <input id="link" placeholder="Cole o link aqui (https://amzn.to/... ou https://meli.la/...)" oninput="aoDigitarLink()">
    <div class="preco-dica">Cole o link para buscar o Nome, Imagem e Loja automaticamente. O Preço será capturado pelo Back-end.</div>

    <label>Nome do produto *</label>
    <input id="nome" placeholder="Ex: Fone Bluetooth JBL Tune 510BT">

    <label>Preço (Opcional - O sistema tentará capturar sozinho)</label>
    <input id="preco" placeholder="Deixe em branco ou digite como fallback (Ex: 189,90)">
    
    <label>URL da imagem *</label>
    <input id="img" placeholder="https://..." oninput="atualizarPreview()">

    <div class="preview">
        <img id="preview-img">
        <span id="preview-txt">A imagem aparece aqui</span>
    </div>

    <label>Categoria *</label>
    <select id="categoria">
        <option value="">— Selecione —</option>
        <option value="casa">Casa</option>
        <option value="eletronicos">Eletrônicos</option>
        <option value="eletrodomesticos">Eletrodomésticos</option>
        <option value="fitness">Fitness</option>
        <option value="escritorio">Escritório</option>
        <option value="moda">Moda</option>
        <option value="beleza">Beleza</option>
        <option value="saude">Saúde</option>
        <option value="livros">Livros</option>
        <option value="outros">Outros</option>
    </select>

    <label>Loja *</label>
    <select id="loja">
        <option value="">— Selecione —</option>
        <option value="amazon">Amazon</option>
        <option value="mercadolivre">Mercado Livre</option>
    </select>

    <label>Descrição</label>
    <textarea id="desc" readonly>Oferta do Dia</textarea>
    <div class="preco-dica">Texto padrão enviado automaticamente.</div>

    <button id="btn-salvar" onclick="salvarProduto()">Salvar Produto na Planilha</button>

    <div class="msg" id="msg"></div>
</div>

<script>
    // Cole a URL do seu Google Apps Script aqui:
    const API = "https://script.google.com/macros/s/AKfycbwnsSaW3Nc91CIohgmBeWz56Uk-NkfPPCgWFP7BAG26VDsyrys2eOlr8a7QaMlBlU7G/exec";

    let debounceTimeout;

    function aoDigitarLink() {
        clearTimeout(debounceTimeout);
        const linkStr = document.getElementById('link').value.trim();
        
        if (!linkStr.startsWith('http')) return;

        debounceTimeout = setTimeout(() => {
            processarLink(linkStr);
        }, 800);
    }

    async function processarLink(url) {
        const inputLink = document.getElementById('link');
        const lojaSelect = document.getElementById('loja');

        const urlLower = url.toLowerCase();
        let loja = '';
        
        if (urlLower.includes('meli.la') || urlLower.includes('mercadolivre')) {
            loja = 'mercadolivre';
            lojaSelect.value = 'mercadolivre';
        } else if (urlLower.includes('amzn.to') || urlLower.includes('amazon')) {
            loja = 'amazon';
            lojaSelect.value = 'amazon';
        }

        inputLink.classList.add('loading-input');
        mostrarMsg('Analisando o link e buscando dados...', 'info');

        try {
            let tituloLimpo = '';
            let imgUrl = '';

            // 1. Rota Mercado Livre (Usa Microlink)
            if (loja === 'mercadolivre') {
                const resposta = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                const dados = await resposta.json();
                if (dados.status === 'success') {
                    tituloLimpo = dados.data.title ? dados.data.title.split('|')[0].trim() : '';
                    imgUrl = dados.data.image ? dados.data.image.url : '';
                }
            }

            // 2. Rota Amazon (Usa Proxy de HTML + DOMParser nativo para evitar bloqueios)
            if (loja === 'amazon' || (!tituloLimpo && !imgUrl && loja !== '')) {
                mostrarMsg('Extraindo dados do servidor da Amazon...', 'info');
                
                // Baixa o HTML bruto contornando o CORS
                const respostaOrigin = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const dadosOrigin = await respostaOrigin.json();
                
                // Converte o texto recebido em um documento HTML invisível para varredura
                const parser = new DOMParser();
                const doc = parser.parseFromString(dadosOrigin.contents, "text/html");

                // Caça a tag oficial do Título na Amazon
                const titleEl = doc.querySelector('#productTitle');
                if (titleEl) {
                    tituloLimpo = titleEl.textContent.trim();
                } else {
                    const metaTitle = doc.querySelector('meta[name="title"]') || doc.querySelector('meta[property="og:title"]');
                    if (metaTitle) tituloLimpo = metaTitle.getAttribute('content').trim();
                }

                // Caça a tag oficial da Imagem na Amazon
                const imgEl = doc.querySelector('#landingImage') || doc.querySelector('#imgBlkFront');
                if (imgEl) {
                    imgUrl = imgEl.getAttribute('src');
                } else {
                    const metaImg = doc.querySelector('meta[property="og:image"]');
                    if (metaImg) imgUrl = metaImg.getAttribute('content');
                }
                
                // Limpeza fina: Remove o texto extra padrão da Amazon no título
                if (tituloLimpo && tituloLimpo.includes(': Amazon.com.br')) {
                    tituloLimpo = tituloLimpo.split(': Amazon.com.br')[0].trim();
                }
            }

            // Atualiza o Formulário
            if (tituloLimpo && !document.getElementById('nome').value) {
                document.getElementById('nome').value = tituloLimpo;
            }

            if (imgUrl && !document.getElementById('img').value) {
                document.getElementById('img').value = imgUrl;
                atualizarPreview();
            }

            // Valida se encontrou algo
            if (tituloLimpo || imgUrl) {
                mostrarMsg('✅ Dados básicos carregados! Selecione a categoria para salvar.', 'sucesso');
            } else {
                throw new Error('A loja acionou o sistema anti-robô.');
            }

        } catch (erro) {
            console.error('Erro de extração:', erro);
            mostrarMsg('A loja bloqueou a auto-leitura. Preencha o nome e a foto manualmente.', 'erro');
        } finally {
            inputLink.classList.remove('loading-input');
        }
    }

    function atualizarPreview() {
        const url = document.getElementById('img').value.trim();
        const img = document.getElementById('preview-img');
        const txt = document.getElementById('preview-txt');
        if (url) {
            img.src = url;
            img.style.display = 'block';
            txt.style.display = 'none';
        } else {
            img.style.display = 'none';
            txt.style.display = 'block';
        }
    }

    function mostrarMsg(texto, tipo) {
        const el = document.getElementById('msg');
        el.textContent = texto;
        el.className = 'msg ' + tipo;
        el.style.display = 'block';
        
        if (tipo !== 'info') {
            setTimeout(() => el.style.display = 'none', 5000);
        }
    }

    function validar(produto) {
        if (!produto.link)       return 'Preencha o link afiliado.';
        if (!produto.nome)       return 'Preencha o nome do produto.';
        if (!produto.img)        return 'Preencha a URL da imagem.';
        if (!produto.categoria)  return 'Selecione uma categoria.';
        if (!produto.loja)       return 'Selecione a loja.';
        return null;
    }

    async function salvarProduto() {
        const btn = document.getElementById('btn-salvar');

        const produto = {
            nome:      document.getElementById('nome').value.trim(),
            preco:     document.getElementById('preco').value.trim(),
            img:       document.getElementById('img').value.trim(),
            link:      document.getElementById('link').value.trim(),
            categoria: document.getElementById('categoria').value,
            loja:      document.getElementById('loja').value,
            desc:      document.getElementById('desc').value.trim()
        };

        const erro = validar(produto);
        if (erro) { mostrarMsg(erro, 'erro'); return; }

        btn.disabled = true;
        btn.textContent = 'Raspando preço e salvando...';

        try {
            await fetch(API, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(produto),
            });

            mostrarMsg('✅ Produto salvo na planilha!', 'sucesso');

            // Limpa o formulário, mas preserva o texto padrão da descrição
            ['nome','preco','img','link'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('categoria').value = '';
            document.getElementById('loja').value = '';
            document.getElementById('preview-img').style.display = 'none';
            document.getElementById('preview-txt').style.display = 'block';

        } catch (err) {
            console.error('Erro de envio:', err);
            mostrarMsg('❌ Erro de comunicação com a Planilha.', 'erro');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Salvar Produto na Planilha';
        }
    }
</script>

</body>
</html>
